name: Wind filtering reproducer checks

on:
  push:
    branches:
      - codex/wind-173701-reproduction
  pull_request:
    paths:
      - scripts/reproduce_wind_pre_ransac_173701.py
      - tests/test_reproduce_wind_pre_ransac_173701.py
      - .github/workflows/wind-173701-tests.yml

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy opencv-python-headless matplotlib pytest
      - name: Run synthetic tests
        run: python -m pytest tests/test_reproduce_wind_pre_ransac_173701.py -q
      - name: Check command interface
        run: python scripts/reproduce_wind_pre_ransac_173701.py --help
