name: Python tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python scripts/validate_window_filter.py --outdir /tmp/grassvio-synthetic
      - run: python scripts/run_sfm_spacing_synthetic_controls.py --out /tmp/grassvio-sfm-synthetic.json
      - name: Check Windows launcher syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/run_local_windows.ps1', 'scripts/run_sfm_spacing_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
