name: Python tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python scripts/validate_window_filter.py --outdir /tmp/grassvio-synthetic
